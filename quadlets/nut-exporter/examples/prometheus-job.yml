- job_name: nut-exporter
  static_configs:
    - targets:
        - "@@NUT_EXPORTER_LISTEN_ADDRESS@@:9199"

- job_name: nut-ups
  metrics_path: /ups_metrics
  params:
    ups:
      - "@@NUT_UPS_NAME@@"
  static_configs:
    - targets:
        - "@@NUT_EXPORTER_LISTEN_ADDRESS@@:9199"
      labels:
        ups: "@@NUT_UPS_NAME@@"
