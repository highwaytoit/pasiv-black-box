---
name: testing

on:
  push:
    branches: [testing]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * *'

concurrency:
  group: ${{ github.workflow }}-testing
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/pasiv-black-box
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'
  UPSIDE_PACKAGE_IMAGE: ghcr.io/home-server-project/cockpit-upside:stable
  BREW_IMAGE: ghcr.io/ublue-os/brew:latest

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            platform: linux/amd64
            base_image: ghcr.io/home-server-project/home-server-base-10:stable
            upstream_variant: ''
            rpm_arch: x86_64
            microarch: v3
            current_tag: testing
            immutable_prefix: testing
          - name: x86_64_v2
            platform: linux/amd64/v2
            base_image: ghcr.io/home-server-project/home-server-base-10:stable-v2
            upstream_variant: v2
            rpm_arch: x86_64_v2
            microarch: v2
            current_tag: testing-v2
            immutable_prefix: testing-v2

    steps:
      - name: Checkout testing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing

      - name: Resolve testing source revision
        shell: bash
        run: |
          set -euo pipefail
          testing_sha="$(git rev-parse HEAD)"
          [[ "${testing_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "TESTING_SHA=${testing_sha}" >> "${GITHUB_ENV}"
          echo "Testing source revision: ${testing_sha}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Resolve verified build inputs
        id: inputs
        shell: bash
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
          UPSTREAM_VARIANT: ${{ matrix.upstream_variant }}
        run: |
          set -euo pipefail

          resolve_ref() {
            local image="$1"
            local variant="${2:-}"
            local digest
            local -a inspect_args=(--override-arch amd64)

            if [[ -n "${variant}" ]]; then
              inspect_args+=(--override-variant "${variant}")
            fi

            digest="$(skopeo inspect \
              "${inspect_args[@]}" \
              --format '{{.Digest}}' \
              "docker://${image}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s' "${image%:*}" "${digest}"
          }

          base_ref="$(resolve_ref "${BASE_IMAGE}" "${UPSTREAM_VARIANT}")"
          upside_ref="$(resolve_ref "${UPSIDE_PACKAGE_IMAGE}")"
          brew_ref="$(resolve_ref "${BREW_IMAGE}")"

          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${base_ref}" >/dev/null
          cosign verify \
            --new-bundle-format=false \
            --key ublue-brew-cosign.pub \
            "${brew_ref}" >/dev/null

          echo "Build platform: ${{ matrix.platform }}"
          echo "Home Server Base image: ${base_ref}"
          echo "UPSide package image: ${upside_ref}"
          echo "uBlue Brew image: ${brew_ref}"

          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "upside_ref=${upside_ref}" >> "${GITHUB_OUTPUT}"
          echo "brew_ref=${brew_ref}" >> "${GITHUB_OUTPUT}"
      - name: Build image
        shell: bash
        env:
          HOME_SERVER_BASE_REF: ${{ steps.inputs.outputs.base_ref }}
          UPSIDE_PACKAGE_REF: ${{ steps.inputs.outputs.upside_ref }}
          BREW_REF: ${{ steps.inputs.outputs.brew_ref }}
        run: |
          set -euo pipefail
          sudo podman build \
            --platform "${{ matrix.platform }}" \
            --pull=always \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --build-arg "HOME_SERVER_BASE_IMAGE=${HOME_SERVER_BASE_REF}" \
            --build-arg "UPSIDE_PACKAGE_IMAGE=${UPSIDE_PACKAGE_REF}" \
            --build-arg "BREW_IMAGE=${BREW_REF}" \
            --build-arg "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${TESTING_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "io.highwaytoit.pasiv-black-box.arch=${{ matrix.name }}" \
            --label "io.highwaytoit.pasiv-black-box.microarch=${{ matrix.microarch }}" \
            --tag pasiv-black-box:unrechunked \
            --file Containerfile \
            .

      - name: Rechunk image
        id: rechunk
        shell: bash
        run: |
          set -euo pipefail

          rechunk_tmp="${RUNNER_TEMP}/pasiv-black-box-rechunk-${{ matrix.name }}"
          sudo mkdir -p "${rechunk_tmp}"
          sudo chmod 1777 "${rechunk_tmp}"

          df -h "${RUNNER_TEMP}" /var/lib/containers

          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v "${rechunk_tmp}:/var/tmp" \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            localhost/pasiv-black-box:unrechunked \
            rechunk \
            --max-layers "${RECHUNK_MAX_LAYERS}" \
            localhost/pasiv-black-box:unrechunked \
            localhost/pasiv-black-box:test

          layer_count="$(
            sudo skopeo inspect --raw \
              containers-storage:localhost/pasiv-black-box:test \
              | jq -r '.layers | length'
          )"

          [[ "${layer_count}" =~ ^[0-9]+$ ]]
          if (( layer_count > OCI_LAYER_LIMIT )); then
            echo "ERROR: rechunked image has ${layer_count} layers; OCI maximum is ${OCI_LAYER_LIMIT}" >&2
            exit 1
          fi

          echo "layers=${layer_count}" >> "${GITHUB_OUTPUT}"
          echo "Rechunked image layers: ${layer_count} / OCI max ${OCI_LAYER_LIMIT} (RPM chunk target ${RECHUNK_MAX_LAYERS})"

      - name: Validate completed image
        shell: bash
        env:
          EXPECTED_RPM_ARCH: ${{ matrix.rpm_arch }}
          EXPECTED_IMAGE_ARCH: ${{ matrix.name }}
          EXPECTED_MICROARCH: ${{ matrix.microarch }}
        run: |
          set -euo pipefail
          sudo podman run --rm \
            -e "EXPECTED_RPM_ARCH=${EXPECTED_RPM_ARCH}" \
            -e "EXPECTED_IMAGE_ARCH=${EXPECTED_IMAGE_ARCH}" \
            -e "EXPECTED_MICROARCH=${EXPECTED_MICROARCH}" \
            --entrypoint /bin/bash \
            pasiv-black-box:test \
            -c '
              set -euo pipefail

              check_file() {
                if [[ ! -f "$1" ]]; then
                  echo "ERROR: expected file missing: $1" >&2
                  exit 1
                fi
              }

              bootc container lint --fatal-warnings
              rpm -q \
                systemd-resolved \
                fwupd-efi \
                qemu-guest-agent \
                nut \
                nut-client \
                pcp \
                pcp-pmda-openmetrics \
                net-snmp-utils \
                selinux-policy-extra \
                smartmontools-selinux \
                cockpit-system \
                cockpit-files \
                cockpit-podman \
                cockpit-storaged \
                cockpit-upside
              command -v tailscale
              command -v netbird
              rpm -q tailscale netbird
              check_file /usr/lib/systemd/system/tailscaled.service
              check_file /etc/systemd/system/netbird.service
              test "$(systemctl is-enabled tailscaled.service)" = "enabled"
              test "$(systemctl is-enabled netbird.service)" = "enabled"
              test ! -e /var/lib/tailscale/tailscaled.state
              test ! -e /var/lib/netbird/config.json
              command -v fwupdmgr
              command -v smartctl
              command -v resolvectl
              command -v snmpget
              command -v snmpwalk
              semodule -l >/dev/null
              check_file /usr/share/cockpit/upside/manifest.json
              for template in \
                cockpit/cockpit.container \
                network/pasiv-monitoring.network \
                caddy/caddy.container \
                authelia/authelia.container \
                grafana/grafana.container \
                prometheus/prometheus.container \
                blackbox-exporter/blackbox-exporter.container \
                snmp-exporter/snmp-exporter.container \
                node-exporter/node-exporter.container \
                loki/loki.container \
                alloy/alloy.container \
                victoriametrics/victoriametrics.container \
                alertmanager/alertmanager.container; do
                check_file "/usr/share/pasiv-black-box/quadlets/${template}"
              done
              check_file /usr/share/pasiv-black-box/quadlets/prometheus/examples/prometheus.yml
              check_file /usr/share/pasiv-black-box/quadlets/blackbox-exporter/examples/blackbox.yml
              check_file /usr/share/pasiv-black-box/quadlets/blackbox-exporter/docs/BLACKBOX-EXPORTER.md
              check_file /usr/share/pasiv-black-box/quadlets/snmp-exporter/examples/snmp-auth.yml
              check_file /usr/share/pasiv-black-box/quadlets/snmp-exporter/examples/snmp.env.example
              check_file /usr/share/pasiv-black-box/quadlets/snmp-exporter/docs/SNMP-EXPORTER.md
              check_file /usr/share/pasiv-black-box/quadlets/node-exporter/examples/prometheus-job.yml
              check_file /usr/share/pasiv-black-box/quadlets/node-exporter/docs/NODE-EXPORTER.md
              check_file /usr/share/pasiv-black-box/quadlets/alertmanager/examples/alertmanager.yml
              check_file /usr/share/pasiv-black-box/doc/README.md
              check_file /usr/share/pasiv-black-box/doc/QUADLETS.md
              check_file /usr/share/pasiv-black-box/doc/QUADLET-LIBRARY.md
              check_file /usr/share/pasiv-black-box/doc/NUT-UPSide.md
              check_file /usr/libexec/pasiv-black-box/health/identity
              check_file /usr/share/homebrew.tar.zst
              check_file /usr/lib/systemd/system/brew-setup.service
              check_file /usr/lib/systemd/system/brew-update.timer
              check_file /usr/lib/systemd/system/brew-upgrade.timer
              check_file /etc/profile.d/brew.sh
              test "$(systemctl is-enabled brew-setup.service)" = "enabled"
              test "$(systemctl is-enabled brew-update.timer)" = "enabled"
              test "$(systemctl is-enabled brew-upgrade.timer 2>/dev/null || true)" = "disabled"
              check_file /usr/lib/pki/containers/highwaytoit.pub
              check_file /etc/containers/registries.d/ghcr.io-highwaytoit.yaml
              check_file /etc/systemd/zram-generator.conf
              check_file /etc/NetworkManager/conf.d/90-systemd-resolved.conf
              check_file /usr/lib/tmpfiles.d/pasiv-black-box-resolved.conf
              grep -Fq "@@NODE_EXPORTER_LISTEN_ADDRESS@@" /usr/share/pasiv-black-box/quadlets/node-exporter/node-exporter.container
              grep -Fq "@@NODE_EXPORTER_LISTEN_ADDRESS@@" /usr/share/pasiv-black-box/quadlets/node-exporter/examples/prometheus-job.yml
              grep -Fqx "dns=systemd-resolved" /etc/NetworkManager/conf.d/90-systemd-resolved.conf
              grep -Fqx "L+ /etc/resolv.conf - - - - /run/systemd/resolve/stub-resolv.conf" /usr/lib/tmpfiles.d/pasiv-black-box-resolved.conf
              test "$(systemctl is-enabled systemd-resolved.service)" = "enabled"
              if dnf repolist --enabled | grep -Eiq "epel|tailscale|netbird"; then
                echo "ERROR: external repository unexpectedly enabled in completed image" >&2
                dnf repolist --enabled
                exit 1
              fi
              /usr/libexec/pasiv-black-box/health/identity
              jq empty /etc/containers/policy.json
              grep -Fq "ghcr.io/highwaytoit/pasiv-black-box:" /etc/containers/registries.d/ghcr.io-highwaytoit.yaml
              grep -Fq "use-sigstore-attachments: true" /etc/containers/registries.d/ghcr.io-highwaytoit.yaml

              glibc_arch="$(rpm -q --qf "%{ARCH}\\n" glibc | head -n1)"
              if [[ "${glibc_arch}" != "${EXPECTED_RPM_ARCH}" ]]; then
                echo "ERROR: glibc RPM architecture is ${glibc_arch}; expected ${EXPECTED_RPM_ARCH}" >&2
                exit 1
              fi
              echo "Validated RPM architecture: ${glibc_arch}"
            '

          arch_label="$(sudo podman image inspect pasiv-black-box:test \
            --format '{{ index .Labels "io.highwaytoit.pasiv-black-box.arch" }}')"
          microarch_label="$(sudo podman image inspect pasiv-black-box:test \
            --format '{{ index .Labels "io.highwaytoit.pasiv-black-box.microarch" }}')"
          [[ "${arch_label}" == "${EXPECTED_IMAGE_ARCH}" ]]
          [[ "${microarch_label}" == "${EXPECTED_MICROARCH}" ]]
          echo "Validated image labels: arch=${arch_label}, microarch=${microarch_label}"

      - name: Prepare testing tags
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${TESTING_SHA:0:7}"
          build_tag="${{ matrix.immutable_prefix }}-$(date -u +%Y%m%d)-${short_sha}"
          echo "BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"
          echo "CURRENT_TAG=${{ matrix.current_tag }}" >> "${GITHUB_ENV}"
          echo "Publishing ${IMAGE_REPOSITORY}:${{ matrix.current_tag }} and ${IMAGE_REPOSITORY}:${build_tag}"

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Push testing image
        id: push
        shell: bash
        run: |
          set -euo pipefail

          sudo podman tag pasiv-black-box:test "${IMAGE_REPOSITORY}:${BUILD_TAG}"
          sudo podman tag pasiv-black-box:test "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/digest \
            "${IMAGE_REPOSITORY}:${BUILD_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published ${CURRENT_TAG} digest: ${digest}"

      - name: Sign image digest
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          # Cosign v3 warns that the legacy bundle format is deprecated. Keep
          # it intentionally until containers/image and bootc can enforce the
          # current Sigstore bundle format through our sigstoreSigned policy.
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify published signature
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          HOME_SERVER_BASE_REF: ${{ steps.inputs.outputs.base_ref }}
          UPSIDE_PACKAGE_REF: ${{ steps.inputs.outputs.upside_ref }}
          BREW_REF: ${{ steps.inputs.outputs.brew_ref }}
          RECHUNK_LAYERS: ${{ steps.rechunk.outputs.layers }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '## Pasiv Black Box testing'
            echo
            echo "- Source branch: testing"
            echo "- Source revision: ${TESTING_SHA:-unknown}"
            echo "- Home Server Base: ${HOME_SERVER_BASE_REF:-unknown}"
            echo "- Base profile: AlmaLinux 10 Minimal Plus via Home Server Base 10"
            echo "- Build platform: ${{ matrix.platform }}"
            echo "- RPM architecture: ${{ matrix.rpm_arch }}"
            echo "- CPU microarchitecture baseline: ${{ matrix.microarch }}"
            echo "- UPSide package source: ${UPSIDE_PACKAGE_REF:-unknown}"
            echo "- uBlue Brew image: ${BREW_REF:-unknown}"
            echo "- Rechunked layers: ${RECHUNK_LAYERS:-unknown} / OCI max ${OCI_LAYER_LIMIT} (RPM chunk target ${RECHUNK_MAX_LAYERS})"
            if [[ -n "${PUBLISHED_DIGEST:-}" ]]; then
              echo "- Published tag: ${IMAGE_REPOSITORY}:${CURRENT_TAG}"
              echo "- Immutable tag: ${IMAGE_REPOSITORY}:${BUILD_TAG:-unknown}"
              echo "- Published digest: ${IMAGE_REPOSITORY}@${PUBLISHED_DIGEST}"
            else
              echo '- Published: no image published'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: cleanup
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - name: Remove expired testing images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: pasiv-black-box
          delete-tags: 'testing-*'
          exclude-tags: 'testing,testing-v2,10,10-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true

