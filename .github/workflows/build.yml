---
name: stable

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '35 15 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/pasiv-black-box
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'
  UPSIDE_PACKAGE_IMAGE: ghcr.io/home-server-project/cockpit-upside:stable
  BREW_IMAGE: ghcr.io/ublue-os/brew:latest

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            platform: linux/amd64
            base_image: ghcr.io/home-server-project/home-server-base-10:stable
            upstream_variant: ''
            rpm_arch: x86_64
            microarch: v3
            current_tag: '10'
            immutable_prefix: '10'
          - name: x86_64_v2
            platform: linux/amd64/v2
            base_image: ghcr.io/home-server-project/home-server-base-10:stable-v2
            upstream_variant: v2
            rpm_arch: x86_64_v2
            microarch: v2
            current_tag: '10-v2'
            immutable_prefix: '10-v2'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Resolve verified build inputs
        id: inputs
        shell: bash
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
          UPSTREAM_VARIANT: ${{ matrix.upstream_variant }}
        run: |
          set -euo pipefail

          resolve_ref() {
            local image="$1"
            local variant="${2:-}"
            local digest
            local -a inspect_args=(--override-arch amd64)

            if [[ -n "${variant}" ]]; then
              inspect_args+=(--override-variant "${variant}")
            fi

            digest="$(skopeo inspect \
              "${inspect_args[@]}" \
              --format '{{.Digest}}' \
              "docker://${image}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s' "${image%:*}" "${digest}"
          }

          base_ref="$(resolve_ref "${BASE_IMAGE}" "${UPSTREAM_VARIANT}")"
          brew_ref="$(resolve_ref "${BREW_IMAGE}")"

          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${base_ref}" >/dev/null
          cosign verify \
            --new-bundle-format=false \
            --key ublue-brew-cosign.pub \
            "${brew_ref}" >/dev/null

          echo "Build platform: ${{ matrix.platform }}"
          echo "Home Server Base image: ${base_ref}"
          echo "UPSide package image: ${UPSIDE_PACKAGE_IMAGE}"
          echo "uBlue Brew image: ${brew_ref}"

          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "brew_ref=${brew_ref}" >> "${GITHUB_OUTPUT}"
      - name: Build image
        shell: bash
        env:
          HOME_SERVER_BASE_REF: ${{ steps.inputs.outputs.base_ref }}
          BREW_REF: ${{ steps.inputs.outputs.brew_ref }}
        run: |
          set -euo pipefail
          sudo podman build \
            --platform "${{ matrix.platform }}" \
            --pull=always \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --build-arg "HOME_SERVER_BASE_IMAGE=${HOME_SERVER_BASE_REF}" \
            --build-arg "UPSIDE_PACKAGE_IMAGE=${UPSIDE_PACKAGE_IMAGE}" \
            --build-arg "BREW_IMAGE=${BREW_REF}" \
            --build-arg "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "io.highwaytoit.pasiv-black-box.arch=${{ matrix.name }}" \
            --label "io.highwaytoit.pasiv-black-box.microarch=${{ matrix.microarch }}" \
            --tag pasiv-black-box:unrechunked \
            --file Containerfile \
            .

      - name: Rechunk image
        id: rechunk
        shell: bash
        run: |
          set -euo pipefail

          rechunk_tmp="${RUNNER_TEMP}/pasiv-black-box-rechunk-${{ matrix.name }}"
          sudo mkdir -p "${rechunk_tmp}"
          sudo chmod 1777 "${rechunk_tmp}"

          df -h "${RUNNER_TEMP}" /var/lib/containers

          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v "${rechunk_tmp}:/var/tmp" \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            localhost/pasiv-black-box:unrechunked \
            rechunk \
            --max-layers "${RECHUNK_MAX_LAYERS}" \
            localhost/pasiv-black-box:unrechunked \
            localhost/pasiv-black-box:test

          layer_count="$(
            sudo skopeo inspect --raw \
              containers-storage:localhost/pasiv-black-box:test \
              | jq -r '.layers | length'
          )"

          [[ "${layer_count}" =~ ^[0-9]+$ ]]
          if (( layer_count > OCI_LAYER_LIMIT )); then
            echo "ERROR: rechunked image has ${layer_count} layers; OCI maximum is ${OCI_LAYER_LIMIT}" >&2
            exit 1
          fi

          echo "layers=${layer_count}" >> "${GITHUB_OUTPUT}"
          echo "Rechunked image layers: ${layer_count} / OCI max ${OCI_LAYER_LIMIT} (RPM chunk target ${RECHUNK_MAX_LAYERS})"

      - name: Validate architecture artifact
        shell: bash
        env:
          EXPECTED_RPM_ARCH: ${{ matrix.rpm_arch }}
          EXPECTED_IMAGE_ARCH: ${{ matrix.name }}
          EXPECTED_MICROARCH: ${{ matrix.microarch }}
        run: |
          set -euo pipefail

          sudo podman run --rm \
            -e "EXPECTED_RPM_ARCH=${EXPECTED_RPM_ARCH}" \
            --entrypoint /bin/bash \
            pasiv-black-box:test \
            -c '
              set -euo pipefail
              glibc_arch="$(rpm -q --qf "%{ARCH}\\n" glibc | head -n1)"
              if [[ "${glibc_arch}" != "${EXPECTED_RPM_ARCH}" ]]; then
                echo "ERROR: glibc RPM architecture is ${glibc_arch}; expected ${EXPECTED_RPM_ARCH}" >&2
                exit 1
              fi
              echo "Validated RPM architecture: ${glibc_arch}"
            '

          arch_label="$(sudo podman image inspect pasiv-black-box:test \
            --format '{{ index .Labels "io.highwaytoit.pasiv-black-box.arch" }}')"
          microarch_label="$(sudo podman image inspect pasiv-black-box:test \
            --format '{{ index .Labels "io.highwaytoit.pasiv-black-box.microarch" }}')"
          [[ "${arch_label}" == "${EXPECTED_IMAGE_ARCH}" ]]
          [[ "${microarch_label}" == "${EXPECTED_MICROARCH}" ]]
          echo "Validated image labels: arch=${arch_label}, microarch=${microarch_label}"

      - name: Prepare release tags
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          build_tag="${{ matrix.immutable_prefix }}-$(date -u +%Y%m%d)-${short_sha}"
          echo "BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"
          echo "CURRENT_TAG=${{ matrix.current_tag }}" >> "${GITHUB_ENV}"
          echo "Publishing ${IMAGE_REPOSITORY}:${{ matrix.current_tag }} and ${IMAGE_REPOSITORY}:${build_tag}"

      - name: Login to GHCR
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Push stable image
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        shell: bash
        run: |
          set -euo pipefail

          sudo podman tag pasiv-black-box:test "${IMAGE_REPOSITORY}:${BUILD_TAG}"
          sudo podman tag pasiv-black-box:test "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/digest \
            "${IMAGE_REPOSITORY}:${BUILD_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published stable digest: ${digest}"

      - name: Sign image digest
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          # Cosign v3 warns that the legacy bundle format is deprecated. Keep
          # it intentionally until containers/image and bootc can enforce the
          # current Sigstore bundle format through our sigstoreSigned policy.
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify published signature
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          HOME_SERVER_BASE_REF: ${{ steps.inputs.outputs.base_ref }}
          BREW_REF: ${{ steps.inputs.outputs.brew_ref }}
          RECHUNK_LAYERS: ${{ steps.rechunk.outputs.layers }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '## Pasiv Black Box stable'
            echo
            echo "- Source revision: ${GITHUB_SHA:-unknown}"
            echo "- Home Server Base: ${HOME_SERVER_BASE_REF:-unknown}"
            echo "- Base profile: AlmaLinux 10 Minimal Plus via Home Server Base 10"
            echo "- Build platform: ${{ matrix.platform }}"
            echo "- RPM architecture: ${{ matrix.rpm_arch }}"
            echo "- CPU microarchitecture baseline: ${{ matrix.microarch }}"
            echo "- Completed-image validation: 1 Passive health + 1 strict bootc lint before rechunk"
            echo "- UPSide package source: ${UPSIDE_PACKAGE_IMAGE}"
            echo "- uBlue Brew image: ${BREW_REF:-unknown}"
            echo "- Rechunked layers: ${RECHUNK_LAYERS:-unknown} / OCI max ${OCI_LAYER_LIMIT} (RPM chunk target ${RECHUNK_MAX_LAYERS})"
            if [[ -n "${PUBLISHED_DIGEST:-}" ]]; then
              echo "- Published tag: ${IMAGE_REPOSITORY}:${CURRENT_TAG}"
              echo "- Immutable tag: ${IMAGE_REPOSITORY}:${BUILD_TAG:-unknown}"
              echo "- Published digest: ${IMAGE_REPOSITORY}@${PUBLISHED_DIGEST}"
            else
              echo '- Published: validation only'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Publish GitHub release (${{ matrix.name }})
    needs: build
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            current_tag: '10'
            title: 'Pasiv Black Box 10'
            latest: 'yes'
          - name: x86_64_v2
            current_tag: '10-v2'
            title: 'Pasiv Black Box 10 x86-64-v2'
            latest: 'no'

    steps:
      - name: Install release tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq skopeo

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | skopeo login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ matrix.current_tag }}
          RELEASE_TITLE_BASE: ${{ matrix.title }}
          RELEASE_LATEST: ${{ matrix.latest }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          repository="pasiv-black-box"
          short_sha="${GITHUB_SHA:0:7}"
          release_pattern="^${CURRENT_TAG}-[0-9]{8}-${short_sha}$"
          release_tag="$(
            skopeo list-tags "docker://${registry}/${repository}" \
              | jq -r --arg pattern "${release_pattern}" '.Tags[]? | select(test($pattern))' \
              | sort \
              | tail -n 1
          )"
          [[ -n "${release_tag}" ]] || { echo "Could not find release tag matching ${release_pattern}."; exit 1; }

          build_date="${release_tag#${CURRENT_TAG}-}"
          build_date="${build_date%-${short_sha}}"
          release_date="${build_date:0:4}-${build_date:4:2}-${build_date:6:2}"
          current_image="${registry}/${repository}:${CURRENT_TAG}"
          release_image="${registry}/${repository}:${release_tag}"
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${release_image}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          release_title="${RELEASE_TITLE_BASE} - ${release_date}"

          cat > /tmp/release-notes.md <<EOF_NOTES
          ## ${RELEASE_TITLE_BASE}

          Signed Pasiv Black Box image built on Home Server Base 10, with AlmaLinux 10 as the upstream Enterprise Linux foundation.

          ### Image

          Current: `${current_image}`
          Immutable: `${release_image}`
          Digest: `${digest}`

          ### Installation baseline

          This release belongs to the `${CURRENT_TAG}` CPU-baseline image line. Choose the correct image before installation. Moving between the normal and x86-64-v2 lines should be treated as a reinstall rather than an in-place switch.

          The published image digest is signed with the Pasiv Black Box Cosign key.
          EOF_NOTES

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ "${RELEASE_LATEST}" == "yes" ]]; then
              gh release edit "${release_tag}" --repo "${GITHUB_REPOSITORY}" --title "${release_title}" --notes-file /tmp/release-notes.md --latest
            else
              gh release edit "${release_tag}" --repo "${GITHUB_REPOSITORY}" --title "${release_title}" --notes-file /tmp/release-notes.md
            fi
          else
            if [[ "${RELEASE_LATEST}" == "yes" ]]; then
              gh release create "${release_tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${release_title}" --notes-file /tmp/release-notes.md --latest
            else
              gh release create "${release_tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${release_title}" --notes-file /tmp/release-notes.md
            fi
          fi

  cleanup:
    name: cleanup
    needs: release
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Remove expired normal stable images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: pasiv-black-box
          delete-tags: '10-*'
          exclude-tags: '10,10-v2,10-v2-*,testing,testing-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true

      - name: Remove expired v2 stable images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: pasiv-black-box
          delete-tags: '10-v2-*'
          exclude-tags: '10,10-v2,testing,testing-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true

      - name: Remove expired GitHub Releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cutoff_epoch="$(date -u -d '45 days ago' +%s)"
          keep_count=7

          clean_release_line() {
            local pattern="$1"
            local label="$2"
            local -a releases=()

            mapfile -t releases < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | select(.draft == false) | select(.tag_name | test("'"$pattern"'")) | [.published_at, (.id | tostring), .tag_name] | @tsv' \
                | sort -r
            )

            echo "${label} releases found: ${#releases[@]}"
            for i in "${!releases[@]}"; do
              IFS=$'\t' read -r published_at release_id tag <<< "${releases[${i}]}"
              if (( i < keep_count )); then
                echo "KEEP newest: ${tag} (${published_at})"
                continue
              fi
              published_epoch="$(date -u -d "${published_at}" +%s)"
              if (( published_epoch >= cutoff_epoch )); then
                echo "KEEP recent: ${tag} (${published_at})"
                continue
              fi
              echo "DELETE expired release: ${tag} (${published_at})"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
              if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
              fi
            done
          }

          clean_release_line '^10-[0-9]{8}-[0-9a-f]{7}$' 'Normal Stable'
          clean_release_line '^10-v2-[0-9]{8}-[0-9a-f]{7}$' 'V2 Stable'

