---
name: stable

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '35 15 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/pasiv-black-box
  CURRENT_TAG: '10'
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'
  HOME_SERVER_BASE_IMAGE: ghcr.io/home-server-project/home-server-base-10:stable
  UPSIDE_PACKAGE_IMAGE: ghcr.io/home-server-project/cockpit-upside:stable

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Resolve verified build inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail

          resolve_ref() {
            local image="$1"
            local digest
            digest="$(skopeo inspect \
              --override-arch amd64 \
              --format '{{.Digest}}' \
              "docker://${image}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s' "${image%:*}" "${digest}"
          }

          base_ref="$(resolve_ref "${HOME_SERVER_BASE_IMAGE}")"
          upside_ref="$(resolve_ref "${UPSIDE_PACKAGE_IMAGE}")"

          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${base_ref}" >/dev/null

          echo "Home Server Base image: ${base_ref}"
          echo "UPSide package image: ${upside_ref}"

          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "upside_ref=${upside_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        shell: bash
        env:
          HOME_SERVER_BASE_REF: ${{ steps.inputs.outputs.base_ref }}
          UPSIDE_PACKAGE_REF: ${{ steps.inputs.outputs.upside_ref }}
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --build-arg "HOME_SERVER_BASE_IMAGE=${HOME_SERVER_BASE_REF}" \
            --build-arg "UPSIDE_PACKAGE_IMAGE=${UPSIDE_PACKAGE_REF}" \
            --build-arg "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag pasiv-black-box:unrechunked \
            --file Containerfile \
            .

      - name: Rechunk image
        id: rechunk
        shell: bash
        run: |
          set -euo pipefail

          rechunk_tmp="${RUNNER_TEMP}/pasiv-black-box-rechunk"
          sudo mkdir -p "${rechunk_tmp}"
          sudo chmod 1777 "${rechunk_tmp}"

          df -h "${RUNNER_TEMP}" /var/lib/containers

          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v "${rechunk_tmp}:/var/tmp" \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            localhost/pasiv-black-box:unrechunked \
            rechunk \
            --max-layers "${RECHUNK_MAX_LAYERS}" \
            localhost/pasiv-black-box:unrechunked \
            localhost/pasiv-black-box:test

          layer_count="$(
            sudo skopeo inspect --raw \
              containers-storage:localhost/pasiv-black-box:test \
              | jq -r '.layers | length'
          )"

          [[ "${layer_count}" =~ ^[0-9]+$ ]]
          if (( layer_count > OCI_LAYER_LIMIT )); then
            echo "ERROR: rechunked image has ${layer_count} layers; OCI maximum is ${OCI_LAYER_LIMIT}" >&2
            exit 1
          fi

          echo "layers=${layer_count}" >> "${GITHUB_OUTPUT}"
          echo "Rechunked image layers: ${layer_count} / OCI max ${OCI_LAYER_LIMIT} (RPM chunk target ${RECHUNK_MAX_LAYERS})"

      - name: Validate completed image
        shell: bash
        run: |
          set -euo pipefail
          sudo podman run --rm \
            --entrypoint /bin/bash \
            pasiv-black-box:test \
            -c '
              set -euo pipefail

              check_file() {
                if [[ ! -f "$1" ]]; then
                  echo "ERROR: expected file missing: $1" >&2
                  exit 1
                fi
              }

              bootc container lint --fatal-warnings
              rpm -q \
                systemd-resolved \
                fwupd-efi \
                qemu-guest-agent \
                nut \
                nut-client \
                pcp \
                pcp-pmda-openmetrics \
                net-snmp-utils \
                selinux-policy-extra \
                smartmontools-selinux \
                cockpit-system \
                cockpit-files \
                cockpit-podman \
                cockpit-storaged \
                cockpit-upside
              command -v tailscale
              command -v netbird
              command -v fwupdmgr
              command -v smartctl
              command -v micro
              command -v resolvectl
              command -v snmpget
              command -v snmpwalk
              semodule -l >/dev/null
              check_file /usr/share/cockpit/upside/manifest.json
              for template in \
                cockpit/cockpit.container \
                network/pasiv-monitoring.network \
                caddy/caddy.container \
                authelia/authelia.container \
                grafana/grafana.container \
                prometheus/prometheus.container \
                blackbox-exporter/blackbox-exporter.container \
                snmp-exporter/snmp-exporter.container \
                node-exporter/node-exporter.container \
                loki/loki.container \
                alloy/alloy.container \
                victoriametrics/victoriametrics.container \
                alertmanager/alertmanager.container; do
                check_file "/usr/share/pasiv-black-box/quadlets/${template}"
              done
              check_file /usr/share/pasiv-black-box/quadlets/prometheus/examples/prometheus.yml
              check_file /usr/share/pasiv-black-box/quadlets/blackbox-exporter/examples/blackbox.yml
              check_file /usr/share/pasiv-black-box/quadlets/blackbox-exporter/docs/BLACKBOX-EXPORTER.md
              check_file /usr/share/pasiv-black-box/quadlets/snmp-exporter/examples/snmp-auth.yml
              check_file /usr/share/pasiv-black-box/quadlets/snmp-exporter/examples/snmp.env.example
              check_file /usr/share/pasiv-black-box/quadlets/snmp-exporter/docs/SNMP-EXPORTER.md
              check_file /usr/share/pasiv-black-box/quadlets/node-exporter/examples/prometheus-job.yml
              check_file /usr/share/pasiv-black-box/quadlets/node-exporter/docs/NODE-EXPORTER.md
              check_file /usr/share/pasiv-black-box/quadlets/alertmanager/examples/alertmanager.yml
              check_file /usr/share/pasiv-black-box/doc/README.md
              check_file /usr/share/pasiv-black-box/doc/QUADLETS.md
              check_file /usr/share/pasiv-black-box/doc/QUADLET-LIBRARY.md
              check_file /usr/share/pasiv-black-box/doc/NUT-UPSide.md
              check_file /usr/libexec/pasiv-black-box/health/identity
              check_file /usr/lib/pki/containers/highwaytoit.pub
              check_file /etc/containers/registries.d/ghcr.io-highwaytoit.yaml
              check_file /etc/systemd/zram-generator.conf
              check_file /etc/NetworkManager/conf.d/90-systemd-resolved.conf
              check_file /usr/lib/tmpfiles.d/pasiv-black-box-resolved.conf
              grep -Fq "@@NODE_EXPORTER_LISTEN_ADDRESS@@" /usr/share/pasiv-black-box/quadlets/node-exporter/node-exporter.container
              grep -Fq "@@NODE_EXPORTER_LISTEN_ADDRESS@@" /usr/share/pasiv-black-box/quadlets/node-exporter/examples/prometheus-job.yml
              grep -Fqx "dns=systemd-resolved" /etc/NetworkManager/conf.d/90-systemd-resolved.conf
              grep -Fqx "L+ /etc/resolv.conf - - - - /run/systemd/resolve/stub-resolv.conf" /usr/lib/tmpfiles.d/pasiv-black-box-resolved.conf
              test "$(systemctl is-enabled systemd-resolved.service)" = "enabled"
              /usr/libexec/pasiv-black-box/health/identity
              jq empty /etc/containers/policy.json
              grep -Fq "ghcr.io/highwaytoit/pasiv-black-box:" /etc/containers/registries.d/ghcr.io-highwaytoit.yaml
              grep -Fq "use-sigstore-attachments: true" /etc/containers/registries.d/ghcr.io-highwaytoit.yaml
            '

      - name: Prepare release tags
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          build_tag="10-$(date -u +%Y%m%d)-${short_sha}"
          echo "BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"
          echo "Publishing ${IMAGE_REPOSITORY}:${CURRENT_TAG} and ${IMAGE_REPOSITORY}:${build_tag}"

      - name: Login to GHCR
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Push stable image
        id: push
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail

          sudo podman tag pasiv-black-box:test "${IMAGE_REPOSITORY}:${BUILD_TAG}"
          sudo podman tag pasiv-black-box:test "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/digest \
            "${IMAGE_REPOSITORY}:${BUILD_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published stable digest: ${digest}"

      - name: Sign image digest
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify published signature
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          HOME_SERVER_BASE_REF: ${{ steps.inputs.outputs.base_ref }}
          UPSIDE_PACKAGE_REF: ${{ steps.inputs.outputs.upside_ref }}
          RECHUNK_LAYERS: ${{ steps.rechunk.outputs.layers }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '## Pasiv Black Box stable'
            echo
            echo "- Source revision: ${GITHUB_SHA}"
            echo "- Home Server Base: ${HOME_SERVER_BASE_REF:-unknown}"
            echo "- Base profile: AlmaLinux 10 Minimal Plus via Home Server Base 10"
            echo "- UPSide package source: ${UPSIDE_PACKAGE_REF:-unknown}"
            echo "- Rechunked layers: ${RECHUNK_LAYERS:-unknown} / OCI max ${OCI_LAYER_LIMIT} (RPM chunk target ${RECHUNK_MAX_LAYERS})"
            if [[ -n "${PUBLISHED_DIGEST:-}" ]]; then
              echo "- Published tag: ${IMAGE_REPOSITORY}:${CURRENT_TAG}"
              echo "- Immutable tag: ${IMAGE_REPOSITORY}:${BUILD_TAG:-unknown}"
              echo "- Published digest: ${IMAGE_REPOSITORY}@${PUBLISHED_DIGEST}"
            else
              echo '- Published: validation only'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Publish GitHub release
    needs: build
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read

    steps:
      - name: Install release tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq skopeo

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | skopeo login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Publish release for stable image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          repository="pasiv-black-box"
          short_sha="${GITHUB_SHA:0:7}"
          release_pattern="^${CURRENT_TAG}-[0-9]{8}-${short_sha}$"

          release_tag="$(
            skopeo list-tags "docker://${registry}/${repository}" \
              | jq -r --arg pattern "${release_pattern}" \
                  '.Tags[]? | select(test($pattern))' \
              | sort \
              | tail -n 1
          )"

          if [[ -z "${release_tag}" ]]; then
            echo "Could not find release tag matching ${release_pattern}."
            exit 1
          fi

          build_date="${release_tag#${CURRENT_TAG}-}"
          build_date="${build_date%-${short_sha}}"
          release_date="${build_date:0:4}-${build_date:4:2}-${build_date:6:2}"

          current_image="${registry}/${repository}:${CURRENT_TAG}"
          release_image="${registry}/${repository}:${release_tag}"
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${release_image}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          release_title="Pasiv Black Box 10 - ${release_date}"

          cat > /tmp/release-notes.md <<EOF_NOTES
          ## Pasiv Black Box 10

          Signed Pasiv Black Box image built on Home Server Base 10, with AlmaLinux 10 as the upstream Enterprise Linux foundation.

          ### Image

          Current: `${current_image}`
          Immutable: `${release_image}`
          Digest: `${digest}`

          ### Switching to the image

          ```bash
          sudo bootc switch ${current_image}
          ```

          The published image digest is signed with the Pasiv Black Box Cosign key.
          EOF_NOTES

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${release_title}" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

  cleanup:
    name: cleanup
    needs: release
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Remove expired stable images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: pasiv-black-box
          delete-tags: '10-*'
          exclude-tags: '10,testing,testing-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true

      - name: Remove expired GitHub Releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d '45 days ago' +%s)"
          keep_count=7

          mapfile -t releases < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] |
                    select(.draft == false) |
                    select(.tag_name | test("^10-[0-9]{8}-[0-9a-f]{7}$")) |
                    [.published_at, (.id | tostring), .tag_name] |
                    @tsv' \
              | sort -r
          )

          echo "Stable releases found: ${#releases[@]}"
          echo "Keeping at least the newest ${keep_count}; only releases older than 45 days may be removed."

          for i in "${!releases[@]}"; do
            IFS=$'\t' read -r published_at release_id tag <<< "${releases[${i}]}"

            if (( i < keep_count )); then
              echo "KEEP newest: ${tag} (${published_at})"
              continue
            fi

            published_epoch="$(date -u -d "${published_at}" +%s)"
            if (( published_epoch >= cutoff_epoch )); then
              echo "KEEP recent: ${tag} (${published_at})"
              continue
            fi

            echo "DELETE expired release: ${tag} (${published_at})"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"

            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            fi
          done
